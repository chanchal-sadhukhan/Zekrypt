services:

  backend:
    build:
      target: development

    container_name: zekrypt-backend-dev

    ports:
      - "8080:8080"

    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2

    env_file:
      - .env.dev

    stdin_open: true
    tty: true

    depends_on:
      - postgres

  frontend:
    build:
      target: development

    container_name: zekrypt-frontend-dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    env_file:
      - .env.dev

    stdin_open: true
    tty: true

  postgres:
    container_name: zekrypt-postgres-dev

    environment:
      POSTGRES_DB: zekrypt_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    container_name: zekrypt-redis-dev

    ports:
      - "6379:6379"

    volumes:
      - redis-dev-data:/data

volumes:
  maven-cache:
  postgres-dev-data:
  redis-dev-data:
