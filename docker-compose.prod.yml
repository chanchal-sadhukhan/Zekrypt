services:

  backend:
    build:
      target: production

    container_name: zekrypt-backend-prod

    ports:
      - "8080:8080"

    env_file:
      - .env.prod

    restart: unless-stopped

  frontend:
    build:
      target: production

    container_name: zekrypt-frontend-prod

    ports:
      - "3000:3000"

    env_file:
      - .env.prod

    restart: unless-stopped
    